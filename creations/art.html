    <style>
        #background-canvas {
            position: fixed;
            top: 30%;
            left: 0;
            z-index: -1;
        }

        /* Layout, sidebar and its links are the shared .content.has-sidebar /
           .sidebar rules (styles/stylesheet.css) — same design and left margin as
           the Blogs and Photos pages. */
        .art-main {
            flex: 1;
            min-width: 0;
            margin-top: 20px;
            /* sections stack with space between when "All" shows them together */
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Admin-only "+ New category" control and per-link rename icon —
           hidden until body.admin-mode is set (see the check-session fetch
           in the bottom script). */
        .art-add-category {
            display: none;
            margin-top: 10px;
            padding: 6px 0 6px 10px;
            background: none;
            border: none;
            color: #45a049;
            font-size: 14px;
            font-family: 'Optima', arial, sans-serif;
            cursor: pointer;
            text-align: left;
        }
        .art-add-category:hover { text-decoration: underline; }
        body.admin-mode .art-add-category { display: block; }

        .sidebar-link-row { display: flex; align-items: center; }
        .sidebar-link-row .sidebar-link { flex: 1; min-width: 0; }
        .art-rename-btn {
            display: none;
            flex-shrink: 0;
            width: 22px; height: 22px;
            margin-right: 4px;
            background: none;
            border: none;
            color: #bbb;
            font-size: 12px;
            cursor: pointer;
        }
        .art-rename-btn:hover { color: #666; }
        body.admin-mode .art-rename-btn { display: block; }

        /* "All" shows every category stacked, one after another; picking a
           category from the sidebar shows only that section. */
        .art-section { display: none; }
        .art-section.active { display: block; }

        .art-category-title {
            font-size: 20px;
            font-weight: 300;
            color: #666;
            margin: 0 0 16px;
            font-family: 'Optima', arial, sans-serif;
        }

        /* Justified gallery: every cell shares a fixed height, width follows
           the source image's own aspect ratio — no cropping, so pieces keep
           their original proportions instead of being forced into a square. */
        .art-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .art-cell {
            display: block;
            height: 160px;
            border: 1px solid #ddd;
            border-radius: 1px;
            overflow: hidden;
            cursor: pointer;
        }
        .art-cell img {
            height: 100%;
            width: auto;
            object-fit: contain;
            display: block;
            animation: none;
            transition: opacity 0.2s;
        }
        .art-cell:hover img { opacity: 0.86; }

        /* Paper rooms (first, then the other paper pieces): larger, two per row in number order (1 2 / 3 4 / 5 6),
           each filling half the width at its own aspect ratio. */
        .art-rooms {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            width: 70%;
            margin: 0 auto;
        }
        .art-after-rooms { margin-top: 10px; }
        .art-rooms .art-cell { height: auto; }
        .art-rooms .art-cell img { width: 100%; height: auto; }

        /* Every other row fills the full width too, like the rooms row:
           layoutArtRows() below gives each row one shared height and each
           piece the width of its own aspect ratio, so rows end flush right. */
        .art-grid:not(.art-rooms) { justify-content: center; }
        .art-grid:not(.art-rooms) .art-cell { flex: none; box-sizing: border-box; }
        .art-grid:not(.art-rooms) .art-cell img { width: 100%; height: 100%; object-fit: cover; }

    </style>

<script>
    // Click a piece to enlarge it in the existing #imageModal (previously
    // unwired — .profile-img never had a click handler attached to it).
    document.querySelectorAll('.art-cell').forEach(function (cell) {
        cell.addEventListener('click', function (e) {
            e.preventDefault();
            document.getElementById('modalImage').src = cell.querySelector('img').src;
            document.getElementById('imageModal').classList.add('active');
        });
    });
    document.querySelector('#imageModal .modal-close').addEventListener('click', function () {
        document.getElementById('imageModal').classList.remove('active');
    });
    document.getElementById('imageModal').addEventListener('click', function (e) {
        if (e.target.id === 'imageModal') this.classList.remove('active');
    });

    // ── Full-width rows: split each gallery into as many rows as fit at
    // roughly ART_ROW_HEIGHT, then scale each row so it spans the full width. ──
    const ART_ROW_HEIGHT = 260;
    const ART_GAP = 10;
    const ART_ALL_MAX = 0.5;   // in "All", no piece wider than half the gallery; short rows are centered
    function layoutArtRows() {
        const phone = window.matchMedia('(max-width: 768px)').matches; // mobile.css uses a 2-column grid
        const allView = !!document.querySelector('#art-sidebar .sidebar-link.active[data-section="all"]');
        document.querySelectorAll('.art-grid:not(.art-rooms)').forEach(function (grid) {
            const cells = Array.prototype.slice.call(grid.querySelectorAll('.art-cell'));
            if (phone) { cells.forEach(function (c) { c.style.width = c.style.height = ''; }); return; }
            const W = grid.clientWidth;
            if (!W || !cells.length) return;                      // hidden while another section is open
            const ratios = cells.map(function (c) {
                const img = c.querySelector('img');
                return img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1;
            });
            const total = ratios.reduce(function (a, b) { return a + b; }, 0);
            const rowCount = Math.max(1, Math.min(cells.length, Math.round(total * ART_ROW_HEIGHT / W)));
            // greedy split so each row gets about the same total aspect ratio
            let start = 0, acc = 0;
            for (let r = 0; r < rowCount; r++) {
                const goal = total * (r + 1) / rowCount;
                let end = start;
                do { acc += ratios[end]; end++; } while (end < cells.length && (r === rowCount - 1 || acc + ratios[end] / 2 <= goal));
                const rowRatios = ratios.slice(start, end);
                const sum = rowRatios.reduce(function (a, b) { return a + b; }, 0);
                const free = W - ART_GAP * (rowRatios.length - 1);
                let h = free / sum;
                if (allView) h = Math.min(h, W * ART_ALL_MAX / Math.max.apply(null, rowRatios));
                const fills = h * sum >= free - 1;              // a capped row is narrower, so no flush-right fix-up
                let used = 0;
                for (let i = start; i < end; i++) {
                    const w = fills && i === end - 1 ? free - used : Math.floor(h * ratios[i]);
                    used += w;
                    cells[i].style.width = w + 'px';
                    cells[i].style.height = h + 'px';
                }
                start = end;
                if (start >= cells.length) break;
            }
        });
    }
    document.querySelectorAll('.art-grid img').forEach(function (img) {
        img.addEventListener('load', layoutArtRows);
    });
    window.addEventListener('resize', layoutArtRows);
    window.addEventListener('load', layoutArtRows);

    // ── Section switching — "All" (every category, stacked) by default;
    // picking a sidebar category shows only that section. ────
    const artSidebar = document.getElementById('art-sidebar');
    const artSections = {};
    document.querySelectorAll('.art-main .art-section').forEach(function (s) { artSections[s.id] = s; });

    function showArtSection(id) {
        if (!artSections[id]) id = 'all';
        Object.keys(artSections).forEach(function (key) {
            artSections[key].classList.toggle('active', id === 'all' || key === id);
        });
        artSidebar.querySelectorAll('.sidebar-link').forEach(function (link) {
            link.classList.toggle('active', link.dataset.section === id);
        });
        layoutArtRows();
    }

    artSidebar.addEventListener('click', function (e) {
        const link = e.target.closest('.sidebar-link');
        if (link) { e.preventDefault(); showArtSection(link.dataset.section); }
    });

    // ── Admin: add / rename categories ────────────────────────────────
    // Scope is deliberately light — admin can add a new (empty) category
    // section or rename an existing one; individual pieces still get added
    // by hand-editing this file's <section> markup, same as today.
    const CATEGORIES_URL = '../data/art-categories.json';
    const SAVE_CATEGORIES_URL = '../admin/save-art-categories.php';
    let artCategories = []; // [{id, label}] — only entries ever added/renamed via admin

    function slugify(s) {
        return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || ('cat-' + Date.now());
    }

    function ensureSectionExists(id, label) {
        if (document.getElementById(id)) return;
        const section = document.createElement('section');
        section.className = 'art-section';
        // a new category shows up straight away while "All" is open
        if (artSidebar.querySelector('.sidebar-link.active[data-section="all"]')) section.classList.add('active');
        section.id = id;
        const h2 = document.createElement('h2');
        h2.className = 'art-category-title';
        h2.textContent = label;
        const grid = document.createElement('div');
        grid.className = 'art-grid';
        section.appendChild(h2);
        section.appendChild(grid);
        document.querySelector('.art-main').appendChild(section);
        artSections[id] = section;
    }

    function ensureSidebarLinkExists(id, label) {
        if (artSidebar.querySelector('.sidebar-link[data-section="' + id + '"]')) return;
        const row = document.createElement('div');
        row.className = 'sidebar-link-row';
        row.dataset.categoryRow = id;
        const renameBtn = document.createElement('button');
        renameBtn.type = 'button';
        renameBtn.className = 'art-rename-btn';
        renameBtn.title = 'Rename';
        renameBtn.innerHTML = '&#9998;';
        const a = document.createElement('a');
        a.href = '#' + id;
        a.className = 'sidebar-link';
        a.dataset.section = id;
        a.textContent = label;
        row.appendChild(renameBtn);
        row.appendChild(a);
        document.getElementById('art-add-category').insertAdjacentElement('beforebegin', row);
    }

    function applyCategoryLabels() {
        artCategories.forEach(function (cat) {
            const link = artSidebar.querySelector('.sidebar-link[data-section="' + cat.id + '"]');
            if (link) link.textContent = cat.label;
            const heading = document.querySelector('#' + cat.id + ' .art-category-title');
            if (heading) heading.textContent = cat.label;
        });
    }

    function saveCategories() {
        fetch(SAVE_CATEGORIES_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(artCategories)
        }).catch(function () { alert('Could not save — network error.'); });
    }

    document.getElementById('art-add-category').addEventListener('click', function () {
        const label = prompt('New category name:');
        if (!label || !label.trim()) return;
        const id = slugify(label);
        if (artSidebar.querySelector('.sidebar-link[data-section="' + id + '"]')) { alert('A category with that name already exists.'); return; }
        artCategories.push({ id: id, label: label.trim() });
        ensureSidebarLinkExists(id, label.trim());
        ensureSectionExists(id, label.trim());
        saveCategories();
        showArtSection(id);
    });

    artSidebar.addEventListener('click', function (e) {
        const renameBtn = e.target.closest('.art-rename-btn');
        if (!renameBtn) return;
        const link = renameBtn.closest('.sidebar-link-row').querySelector('.sidebar-link');
        const id = link.dataset.section;
        const current = link.textContent.trim();
        const label = prompt('Rename category:', current);
        if (!label || !label.trim() || label.trim() === current) return;
        link.textContent = label.trim();
        const heading = document.querySelector('#' + id + ' .art-category-title');
        if (heading) heading.textContent = label.trim();
        const existing = artCategories.find(function (c) { return c.id === id; });
        if (existing) existing.label = label.trim(); else artCategories.push({ id: id, label: label.trim() });
        saveCategories();
    });

    // Persisted categories (renames + admin-added ones) — absent/failed
    // fetch just leaves the hardcoded defaults above untouched.
    fetch(CATEGORIES_URL)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
            if (!Array.isArray(data)) return;
            artCategories = data;
            data.forEach(function (cat) {
                ensureSidebarLinkExists(cat.id, cat.label);
                ensureSectionExists(cat.id, cat.label);
            });
            applyCategoryLabels();
        })
        .catch(function () {});

    // ── Admin mode (reveals the add/rename controls above) ─────────────
    fetch('../admin/check-session.php')
        .then(function (r) { return r.json(); })
        .then(function (data) { if (data.admin) document.body.classList.add('admin-mode'); })
        .catch(function () {});
</script>
