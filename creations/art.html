    <style>
        #background-canvas {
            position: fixed;
            top: 30%;
            left: 0;
            z-index: -1;
        }

        /* Layout, sidebar and its links are the shared .content.has-sidebar /
           .sidebar rules (styles/stylesheet.css) — same design and left margin as
           the Blogs and Photos pages. */
        .art-main {
            flex: 1;
            min-width: 0;
            margin-top: 20px;
        }

        /* Admin-only "+ New category" control and per-link rename icon —
           hidden until body.admin-mode is set (see the check-session fetch
           in the bottom script). */
        .art-add-category {
            display: none;
            margin-top: 10px;
            padding: 6px 0 6px 10px;
            background: none;
            border: none;
            color: #45a049;
            font-size: 14px;
            font-family: 'Optima', arial, sans-serif;
            cursor: pointer;
            text-align: left;
        }
        .art-add-category:hover { text-decoration: underline; }
        body.admin-mode .art-add-category { display: block; }

        .sidebar-link-row { display: flex; align-items: center; }
        .sidebar-link-row .sidebar-link { flex: 1; min-width: 0; }
        .art-rename-btn {
            display: none;
            flex-shrink: 0;
            width: 22px; height: 22px;
            margin-right: 4px;
            background: none;
            border: none;
            color: #bbb;
            font-size: 12px;
            cursor: pointer;
        }
        .art-rename-btn:hover { color: #666; }
        body.admin-mode .art-rename-btn { display: block; }

        /* Only the selected section is shown — "Highlights" (a few pieces
           from every category) by default, or a single category once one
           is picked from the sidebar. */
        .art-section { display: none; }
        .art-section.active { display: block; }

        .art-category-title {
            font-size: 20px;
            font-weight: 300;
            color: #666;
            margin: 0 0 16px;
            font-family: 'Optima', arial, sans-serif;
        }

        /* Justified gallery: every cell shares a fixed height, width follows
           the source image's own aspect ratio — no cropping, so pieces keep
           their original proportions instead of being forced into a square. */
        .art-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .art-cell {
            display: block;
            height: 160px;
            border: 1px solid #ddd;
            border-radius: 1px;
            overflow: hidden;
            background: #f0f0f0;
            cursor: pointer;
        }
        .art-cell img {
            height: 100%;
            width: auto;
            object-fit: contain;
            display: block;
            animation: none;
            transition: opacity 0.2s;
        }
        .art-cell:hover img { opacity: 0.86; }

    </style>
</head>

<script>
    // Click a piece to enlarge it in the existing #imageModal (previously
    // unwired — .profile-img never had a click handler attached to it).
    document.querySelectorAll('.art-cell').forEach(function (cell) {
        cell.addEventListener('click', function (e) {
            e.preventDefault();
            document.getElementById('modalImage').src = cell.querySelector('img').src;
            document.getElementById('imageModal').classList.add('active');
        });
    });
    document.querySelector('#imageModal .modal-close').addEventListener('click', function () {
        document.getElementById('imageModal').classList.remove('active');
    });
    document.getElementById('imageModal').addEventListener('click', function (e) {
        if (e.target.id === 'imageModal') this.classList.remove('active');
    });

    // Sidebar highlights whichever category section is currently in view.
    const artSidebarLinks = document.querySelectorAll('.art-sidebar .sidebar-link');
    const artSections = [...document.querySelectorAll('.art-main section')];
    if ('IntersectionObserver' in window && artSections.length) {
        const spy = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                artSidebarLinks.forEach(function (link) {
                    link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
                });
            });
        }, { rootMargin: '-40% 0px -50% 0px' });
        artSections.forEach(function (section) { spy.observe(section); });
    }
</script>
