<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonia's Photos</title>
  <link rel="icon" href="/images/icons/heart3.png" />
  <link rel="stylesheet" href="styles/stylesheet.css">
  <link rel="stylesheet" href="styles/mobile.css">
  <script src="scripts/siteStyle/bck.js"></script>
  <style>
    /* ── Page layout ── */
    .photos-wrap {
      display: flex;
      width: 80%;
      margin: 0 auto;
      padding: 0 20px;
      gap: 40px;
    }
    .photos-sidebar {
      width: 140px;
      flex-shrink: 0;
      margin-top: 20px;
    }
    .photos-main {
      flex: 1;
      min-width: 0;
      margin-top: 20px;
    }
    .sidebar-section { margin-bottom: 30px; }
    .sidebar-title {
      font-size: 18px;
      font-weight: 500;
      color: #666;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #ddd;
    }
    .sidebar-link {
      display: block;
      padding: 8px 0 8px 10px;
      color: #888f8d;
      text-decoration: none;
      font-size: 18px;
      transition: all 0.3s ease;
      border-left: 2px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-link:hover { color: #45a049; border-left-color: #45a049; padding-left: 13px; }
    .sidebar-link.active { color: #45a049; border-left-color: #45a049; font-weight: 500; }

    @media (max-width: 960px) { .photos-wrap { width: 94%; } }
    @media (max-width: 768px) {
      .photos-wrap { flex-direction: column; width: 95%; padding: 0; gap: 0; }
      .photos-sidebar { display: none; }
      .photos-main { margin-top: 10px; }
    }

    #back-btn {
      position: static !important;
      width: auto !important; height: auto !important;
      min-height: unset !important; min-width: unset !important;
      background: none !important; border-radius: 0 !important;
      display: inline !important;
    }

    /* ── Admin toolbar ── */
    .admin-toolbar {
      display: none;
      gap: 10px;
      margin-bottom: 22px;
      align-items: center;
    }
    body.admin-mode .admin-toolbar { display: flex; }
    body.admin-mode.select-mode .admin-toolbar { display: none; }

    .admin-btn {
      background: rgba(210,245,250,0.4);
      border: 1px solid rgba(143,97,77,0.3);
      color: #1d60c0;
      font-family: 'Optima', arial, sans-serif;
      font-size: 13px;
      padding: 7px 14px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s;
      min-height: unset !important; min-width: unset !important;
    }
    .admin-btn:hover { background: #c2e2e787; }
    .admin-hint { font-size: 12px; color: #bbb; font-style: italic; min-height: unset !important; display: inline !important; }

    /* ── Multi-select toolbar ── */
    .select-toolbar {
      display: none;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      padding: 9px 14px;
      background: rgba(210,245,250,0.3);
      border: 1px solid rgba(143,97,77,0.2);
    }
    .select-toolbar.visible { display: flex; flex-wrap: wrap; }
    .select-count { font-size: 13px; color: #666; }
    .select-spacer { flex: 1; }
    .select-album-label { font-size: 12px; color: #999; }
    .select-album-dropdown {
      font-family: 'Optima', arial, sans-serif;
      font-size: 13px;
      border: 1px solid #ddd;
      padding: 5px 8px;
      background: #fafafa;
      color: #555;
      outline: none;
      cursor: pointer;
    }

    /* ── Sidebar album admin icons ── */
    .sidebar-album-row {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .sidebar-album-row .sidebar-link { flex: 1; min-width: 0; }
    .sidebar-icon-btn {
      display: none;
      background: none; border: none; cursor: pointer;
      color: #bbb; font-size: 13px; padding: 4px 3px;
      min-height: unset !important; min-width: unset !important;
      line-height: 1;
    }
    body.admin-mode .sidebar-album-row:hover .sidebar-icon-btn { display: inline; }
    .sidebar-icon-btn:hover { color: #555; }
    .sidebar-icon-del:hover { color: #c00; }
    .sidebar-new-album {
      display: none;
      background: none; border: none; cursor: pointer;
      color: #4caf50; font-size: 13px; padding: 6px 0 6px 10px;
      font-family: 'Optima', arial, sans-serif;
      letter-spacing: 0.03em;
      min-height: unset !important; min-width: unset !important;
    }
    body.admin-mode .sidebar-new-album { display: block; }
    .sidebar-new-album:hover { color: #2e7d32; }

    /* ── Inline text action buttons ── */
    .text-action {
      background: none; border: none; cursor: pointer;
      font-family: 'Optima', arial, sans-serif;
      font-size: 13px; padding: 0;
      min-height: unset !important; min-width: unset !important;
    }
    .text-action-green { color: #4caf50; }
    .text-action-green:hover { color: #2e7d32; }
    .text-action-del { color: #c00; opacity: 0.7; font-size: 12px; }
    .text-action-del:hover { opacity: 1; }

    /* ── Album list ── */
    .album-block { margin-bottom: 48px; }
    .album-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .album-title-link {
      font-size: 19px; font-weight: 300; color: #444;
      letter-spacing: 0.03em; cursor: pointer;
      font-family: 'Optima', arial, sans-serif;
      text-decoration: none;
      min-height: unset !important; min-width: unset !important; display: inline !important;
    }
    .album-title-link:hover { text-decoration: underline; }
    .album-count { font-size: 12px; color: #bbb; min-height: unset !important; display: inline !important; }
    .album-admin-btns { display: none; gap: 6px; margin-left: 4px; }
    body.admin-mode .album-admin-btns { display: flex; }
    .album-edit-btn {
      font-size: 11px; background: rgba(0,80,200,0.12); color: #1d60c0;
      border: 1px solid rgba(0,80,200,0.25); padding: 3px 8px; cursor: pointer;
      border-radius: 2px; min-height: unset !important; min-width: unset !important;
    }
    .album-edit-btn:hover { background: rgba(0,80,200,0.2); }
    .album-del-btn {
      font-size: 11px; background: rgba(200,0,0,0.08); color: #c00;
      border: 1px solid rgba(200,0,0,0.2); padding: 3px 8px; cursor: pointer;
      border-radius: 2px; min-height: unset !important; min-width: unset !important;
    }
    .album-del-btn:hover { background: rgba(200,0,0,0.18); }

    /* Album preview strip */
    .album-strip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; cursor: pointer; }
    .album-strip:hover .album-strip-img img { opacity: 0.84; }
    .album-strip-img { aspect-ratio: 1; overflow: hidden; background: #f5f5f5; }
    .album-strip-img img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      animation: none; transition: opacity 0.2s; min-height: unset !important;
    }
    .album-desc { font-size: 13px; color: #aaa; margin: 0 0 8px; }
    .album-see-all {
      display: inline-block; margin-top: 8px; font-size: 12px; color: #999;
      letter-spacing: 0.05em; cursor: pointer; text-decoration: none; min-height: unset !important;
    }
    .album-see-all:hover { color: #444; }

    /* ── Single album view ── */
    #album-view { display: none; }
    .album-view-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 22px; flex-wrap: wrap;
    }
    .back-btn {
      background: none; border: none; font-size: 12px; color: #999; cursor: pointer;
      padding: 0; letter-spacing: 0.07em; font-family: 'Optima', arial, sans-serif;
      min-height: unset !important; min-width: unset !important;
    }
    .back-btn:hover { color: #333; }
    .album-view-title { font-size: 21px; font-weight: 200; color: #444; letter-spacing: 0.04em; }

    /* ── All-photos filter bar ── */
    .photo-filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .photo-filter-select {
      font-family: 'Optima', arial, sans-serif;
      font-size: 12px;
      color: #666;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 3px;
      padding: 5px 8px;
      cursor: pointer;
    }
    .photo-filter-select:hover { border-color: #bbb; }

    /* ── All-photos flat grid ── */
    /* Index of group covers — original proportions kept, all scaled to the
       same height (no cropping), like a justified gallery. */
    .covers-flow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
    .cover-flow-cell {
      height: 140px; flex: 0 0 auto;
      overflow: hidden; background: #f0f0f0; cursor: pointer;
      border: 1px solid #ddd;
      position: relative;
    }
    .cover-flow-cell img {
      height: 100%; width: auto; object-fit: contain; display: block;
      animation: none; transition: opacity 0.2s; min-height: unset !important;
    }
    .cover-flow-cell:hover img { opacity: 0.86; }
    .cover-flow-label {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); color: #fff;
      font-size: 11px; padding: 4px 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0; transition: opacity 0.15s ease;
    }
    .cover-flow-cell:hover .cover-flow-label { opacity: 1; }
    @media (max-width: 640px) { .cover-flow-cell { height: 90px; } }

    /* ── Catalog layout (album index) ── */
    .catalog-layout {
      display: flex;
      flex-direction: column;
      gap: 0;
      /* breathing room on the left so the covers don't hug the edge */
      padding-left: clamp(10px, 3.5vw, 52px);
    }
    .catalog-row {
      --cover-h: clamp(58px, 9vw, 98px);
      --thumb-h: clamp(50px, 8vw, 84px);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px;
      margin: 0 -7px;
      cursor: pointer;
      border-bottom: 1px solid #f2f2f2;
      position: relative;
      transition: transform 0.15s ease;
    }
    .catalog-row:hover { transform: translateY(-2px); }
    .catalog-row:hover .catalog-label { color: #222; }
    .catalog-row:hover .catalog-cover img { opacity: 0.85; }
    /* Sized via JS to end at the last visible photo, not the full flex row —
       .catalog-thumbs uses flex:1 for its own scroll/fade math, which doesn't
       reflect its actual content width. Left inset matches the row's own
       vertical padding, so the cover gets equal white space on every side. */
    .catalog-row-bg {
      position: absolute; left: -7px; top: 0; bottom: 0;
      border-radius: 3px;
      background: transparent;
      box-shadow: none;
      z-index: 0;
      pointer-events: none;
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    .catalog-row:hover .catalog-row-bg { background: #fff; box-shadow: 0 2px 8px rgb(210, 245, 250); }
    .catalog-cover, .catalog-label, .catalog-thumbs, .row-edit-icon, .row-color-input { position: relative; z-index: 1; }

    .row-edit-icon {
      display: none;
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px;
      background: rgba(255,255,255,0.95); border: 1px solid #ddd; border-radius: 3px;
      font-size: 12px; color: #999; cursor: pointer;
      align-items: center; justify-content: center;
      min-height: unset !important; min-width: unset !important;
    }
    .row-edit-icon:hover { color: #444; border-color: #bbb; }
    body.admin-mode .catalog-row:hover .row-edit-icon { display: flex; }

    .row-color-input {
      display: none;
      position: absolute; right: 42px; top: 50%; transform: translateY(-50%);
      width: 22px; height: 22px;
      padding: 0; border: 1px solid #ddd; border-radius: 50%;
      cursor: pointer; background: none; overflow: hidden;
      -webkit-appearance: none; appearance: none;
      min-height: unset !important; min-width: unset !important;
    }
    .row-color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .row-color-input::-webkit-color-swatch { border: none; border-radius: 50%; }
    .row-color-input::-moz-color-swatch { border: none; border-radius: 50%; }
    body.admin-mode .catalog-row:hover .row-color-input { display: block; }

    .catalog-cover {
      height: var(--cover-h);
      width: var(--cover-h);
      flex-shrink: 0;
      border: 2px solid #ddd;
      overflow: hidden;
      background: #f9f9f9;
      position: relative;
    }
    .catalog-cover img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      animation: none;
      transition: opacity 0.15s;
      min-height: unset !important;
    }

    .catalog-label {
      width: clamp(120px, 16vw, 210px);
      flex-shrink: 0;
      overflow: hidden;
      color: #888;
      letter-spacing: 0.05em;
      font-family: 'Courier New', monospace;
      transition: color 0.15s;
      line-height: 1.4;
    }
    .catalog-label-text {
      display: inline-block;
      white-space: nowrap;
      transform-origin: left center;
      font-size: clamp(15px, 1.6vw, 22px);
    }

    .catalog-thumbs {
      display: flex;
      gap: 3px;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      flex: 1;
      align-items: center;
      scrollbar-width: thin;
    }
    .catalog-thumbs::-webkit-scrollbar { height: 4px; }
    .catalog-thumbs::-webkit-scrollbar-thumb { background: #ddd; }
    /* Only show the scroll cue when the row actually overflows its container */
    .catalog-thumbs.overflowing {
      -webkit-mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
              mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
    }
    .catalog-thumb {
      height: var(--thumb-h);
      width: auto;
      flex-shrink: 0;
      overflow: hidden;
      background: #f5f5f5;
      border: 1px solid #ececec;
      position: relative;
    }
    .catalog-thumb img {
      height: 100%; width: auto;
      object-fit: contain;
      display: block;
      animation: none;
      min-height: unset !important;
    }
    /* admin new-album row */
    .catalog-new-row {
      display: none;
      padding: 10px 0 2px;
    }
    body.admin-mode .catalog-new-row { display: block; }

    @media (max-width: 640px) {
      .catalog-label { width: 100px; }
      .catalog-label-text { font-size: 14px; }
    }

    /* ── Photo rows container ── */
    .photo-rows-container { display: flex; flex-direction: column; gap: 6px; }

    .photo-row {
      display: flex;
      gap: 3px;
      height: 170px;
      align-items: flex-start;
      cursor: pointer;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .photo-row::-webkit-scrollbar { height: 3px; }
    .photo-row::-webkit-scrollbar-thumb { background: #ddd; }
    .photo-row:hover .row-img img { opacity: 0.86; }

    .row-img {
      height: 100%;
      flex: none;
      overflow: hidden;
      background: #f5f5f5;
      position: relative;
    }
    .row-img img {
      height: 100%;
      width: auto;
      display: block;
      object-fit: contain;
      animation: none;
      transition: opacity 0.2s;
      min-height: unset !important;
      pointer-events: none;
    }
    /* First photo in each row: square cover */
    .row-img-cover {
      width: 170px;
      flex-shrink: 0;
    }
    .row-img-cover img {
      width: 100%;
      object-fit: cover;
    }
    .row-img.drag-over { outline: 2px solid #1d60c0; opacity: 0.7; }

    /* Select overlay on row-imgs */
    .row-img .select-check {
      display: none;
      position: absolute;
      top: 4px; left: 4px;
      width: 14px; height: 14px;
      border: 1.5px solid rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.22);
      border-radius: 2px;
      z-index: 5;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: transparent;
      cursor: pointer;
    }
    body.admin-mode .row-img:hover .select-check { display: flex; }
    body.admin-mode .row-img.selected .select-check { display: flex; background: #1d60c0; border-color: #1d60c0; color: #fff; }
    .row-img.selected::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(29,96,192,0.15); pointer-events: none; z-index: 4;
    }
    .row-img .photo-admin-btns {
      display: none; position: absolute; top: 3px; right: 3px; gap: 3px; z-index: 10;
    }
    body.admin-mode .row-img:hover .photo-admin-btns { display: flex; }

    /* Shared photo cell overlays (used in catalog-cover & catalog-thumb within album view) */
    .photo-cell-wrap { position: relative; cursor: pointer; }
    .photo-cell-wrap .select-check {
      display: none;
      position: absolute;
      top: 4px; left: 4px;
      width: 14px; height: 14px;
      border: 1.5px solid rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.22);
      border-radius: 2px;
      z-index: 5;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: transparent;
      cursor: pointer;
    }
    body.admin-mode .photo-cell-wrap:hover .select-check { display: flex; }
    body.admin-mode .photo-cell-wrap.selected .select-check { display: flex; background: #1d60c0; border-color: #1d60c0; color: #fff; }
    .photo-cell-wrap.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(29,96,192,0.15);
      pointer-events: none;
      z-index: 4;
    }
    .photo-cell-wrap .photo-admin-btns {
      display: none;
      position: absolute;
      top: 3px; right: 3px;
      gap: 3px;
      z-index: 10;
    }
    body.admin-mode .photo-cell-wrap:hover .photo-admin-btns { display: flex; }
    .photo-edit-btn {
      background: rgba(0,0,0,0.55); color: #fff; border: none;
      font-size: 10px; padding: 3px 5px; cursor: pointer;
      min-height: unset !important; min-width: unset !important;
    }
    .photo-del-btn {
      background: rgba(180,0,0,0.7); color: #fff; border: none;
      font-size: 10px; padding: 3px 5px; cursor: pointer;
      min-height: unset !important; min-width: unset !important;
    }
    .photo-edit-btn:hover { background: rgba(0,0,0,0.85); }
    .photo-del-btn:hover  { background: rgba(180,0,0,1); }
    .photo-cell-wrap.drag-over { outline: 2px solid #1d60c0; opacity: 0.7; }
    .catalog-row.drag-over .catalog-row-bg { background: rgba(29,96,192,0.06); box-shadow: none; outline: 2px dashed #1d60c0; }

    /* ── Row modal ── */
    #row-modal .modal-box {
      width: min(80vw, 1300px);
      max-height: 80vh;
      overflow-y: auto;
      padding: 30px 34px 30px;
    }
    .row-modal-header {
      font-size: clamp(18px, 2vw, 26px); color: #777; letter-spacing: 0.04em;
      margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #eee;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Flow layout, like the album-view row and All Photos: fixed height,
       each tile's width follows its own photo's aspect ratio (as uploaded),
       nothing cropped. Wraps into new rows once it runs out of width.
       No wrapper div around the img — a plain block element with width:auto
       fills its container instead of shrinking to the image's natural size,
       which is what previously made every tile render at a uniform width
       regardless of the photo's real proportions. flex:0 0 auto (matching
       .cover-flow-cell, which never had this bug) guarantees the tile only
       ever sizes to its content. */
    .detail-grid { --tile-h: clamp(108px, 9vw, 140px); display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-tile {
      position: relative;
      height: var(--tile-h);
      flex: 0 0 auto;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #ddd;
      border-radius: 3px;
      background: transparent;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .detail-tile:hover { background: rgba(29,96,192,0.06); transform: translateY(-2px); }
    .detail-tile img {
      height: 100%; width: auto;
      display: block;
      object-fit: contain;
      animation: none;
      min-height: unset !important;
      transition: filter 0.15s ease;
    }
    .detail-tile:hover img { filter: brightness(0.7); }
    .detail-tile-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 8px;
      color: #fff; font-size: 12px; line-height: 1.35;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }
    .detail-tile:hover .detail-tile-overlay { opacity: 1; }
    .detail-tile-del {
      position: absolute; top: 4px; right: 4px;
      display: none;
      width: 22px; height: 22px;
      background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 2px;
      font-size: 12px; cursor: pointer; z-index: 2;
      min-height: unset !important; min-width: unset !important;
    }
    body.admin-mode .detail-tile:hover .detail-tile-del { display: block; }
    .detail-tile.drag-over { outline: 2px solid #1d60c0; }
    .detail-add-tile {
      height: var(--tile-h); width: 120px; flex-shrink: 0;
      border: 1px dashed #ccc; background: none;
      color: #bbb; font-size: 26px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      min-height: unset !important;
    }
    .detail-add-tile:hover { border-color: #999; color: #888; }
    .row-modal-close {
      float: right; background: none; border: none; font-size: 24px; color: #aaa;
      cursor: pointer; margin: -8px -8px 12px 0;
      min-height: unset !important; min-width: unset !important;
    }
    .row-modal-close:hover { color: #333; }

    /* ── Photo detail popup ── */
    /* compound selector: the generic .modal-box rule further down would otherwise
       win on equal specificity and pin this to 400px */
    .modal-box.photo-detail-box {
      box-sizing: border-box;
      width: min(95vw, 900px);
      height: 50vh;
      min-height: 320px;
      max-height: 94vh;
      overflow-y: auto;
      padding: 22px 26px;
    }
    .photo-detail-layout {
      display: flex;
      gap: 28px;
      align-items: flex-start;

<script>
const DATA_URL   = 'data/albums.json';
const SAVE_URL   = 'admin/save-albums.php';
const UPLOAD_URL = 'admin/upload-image.php';
const ROW_CHUNK  = 6; // default photos per auto-row

let albums = [];
let currentAlbumId = null;
let lightboxPhotos = [];
let lightboxIdx = 0;
let isAdmin = false;
let dragSrc = null;
let selectedPhotos = new Set();
let selectMode = false;

async function init() {
  try {
    const s = await fetch('admin/check-session.php', { cache: 'no-store' }).then(r => r.json());
    if (s.admin) { isAdmin = true; document.body.classList.add('admin-mode'); }
  } catch(e) { console.error('check-session failed — admin mode will stay off:', e); }

  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    albums = r.ok ? (await r.json()) : [];
    if (!Array.isArray(albums)) albums = [];
  } catch(e) { albums = []; }

  renderSidebar(null);
  renderAlbumList();
}

// ── Sidebar ──────────────────────────────────────────────────────
function renderSidebar(activeId) {
  const sidebarAll = document.getElementById('sidebar-all');
  const sidebarAlbums = document.getElementById('sidebar-albums');
  if (sidebarAll) sidebarAll.className = 'sidebar-link' + (activeId == null ? ' active' : '');
  if (sidebarAlbums) {
    sidebarAlbums.innerHTML = albums.map(a =>
      `<div class="sidebar-album-row">
        <a class="sidebar-link${a.id === activeId ? ' active' : ''}" href="#"
           onclick="openAlbum('${a.id}');return false;">• ${esc(a.name)}</a>
        <button class="sidebar-icon-btn" onclick="openAlbumModal('${a.id}')" title="Edit">✎</button>
        <button class="sidebar-icon-btn sidebar-icon-del" onclick="deleteAlbum('${a.id}')" title="Delete">✕</button>
      </div>`
    ).join('');
  }
}

const BORDER_COLORS = ['#8bc34a','#ffc107','#ef9a9a','#90caf9','#ce93d8','#80cbc4','#ffcc80','#a5d6a7'];

// ── Album index — flat photo grid ────────────────────────────────
const photoFilters = { category: '', year: '', city: '' };

function photoYear(p) {
  const m = (p.date || '').match(/\d{4}/);
  return m ? m[0] : '';
}

function photoCategories(p) {
  return (p.tags || '').split(',').map(t => t.trim()).filter(Boolean);
}

function passesPhotoFilters(p) {
  return (!photoFilters.category || photoCategories(p).includes(photoFilters.category))
      && (!photoFilters.year     || photoYear(p) === photoFilters.year)
      && (!photoFilters.city     || (p.city || '') === photoFilters.city);
}

// One entry per group (row) across every album — its cover photo stands in
// for the whole group on the "All Photos" index.
function getGroupCovers() {
  const covers = [];
  albums.forEach(album => {
    groupPhotosIntoRows(album.photos || []).forEach(row => {
      const cover = row.photos[0];
      if (cover) covers.push({ photo: cover, albumId: album.id, rowId: row.rowId, rowLabel: cover.rowLabel || '' });
    });
  });
  return covers;
}

function renderAlbumList() {
  currentAlbumId = null;
  renderSidebar(null);
  document.getElementById('album-list').style.display = 'block';
  document.getElementById('album-view').style.display  = 'none';

  const covers = getGroupCovers();
  photoFilters.category = ''; photoFilters.year = ''; photoFilters.city = '';

  const container = document.getElementById('albums-container');
  if (!covers.length) {
    container.innerHTML = '<p style="color:#ccc;font-size:14px;margin-top:28px;">No photos yet' +
      (isAdmin ? ' — add one with <strong>+ New</strong> in the sidebar.' : '.') + '</p>';
    return;
  }

  const coverPhotos    = covers.map(c => c.photo);
  const categoryOptions = [...new Set(coverPhotos.flatMap(photoCategories))].sort();
  const yearOptions     = [...new Set(coverPhotos.map(photoYear).filter(Boolean))].sort().reverse();
  const cityOptions     = [...new Set(coverPhotos.map(p => p.city).filter(Boolean))].sort();

  const filterSelect = (id, label, options) => options.length ? `
    <select class="photo-filter-select" id="${id}" onchange="onPhotoFilterChange()">
      <option value="">${label}: All</option>
      ${options.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}
    </select>` : '';

  container.innerHTML = `
    <div class="photo-filter-bar">
      ${filterSelect('filter-category', 'Category', categoryOptions)}
      ${filterSelect('filter-year',     'Year',     yearOptions)}
      ${filterSelect('filter-city',     'City',     cityOptions)}
    </div>
    <div class="covers-flow" id="all-photos-grid"></div>`;

  renderFilteredPhotoGrid(covers);
}

function onPhotoFilterChange() {
  photoFilters.category = document.getElementById('filter-category')?.value || '';
  photoFilters.year  = document.getElementById('filter-year')?.value  || '';
  photoFilters.city  = document.getElementById('filter-city')?.value  || '';
  renderFilteredPhotoGrid(getGroupCovers());
}

function renderFilteredPhotoGrid(covers) {
  const visible = covers.filter(c => passesPhotoFilters(c.photo));

  const grid = document.getElementById('all-photos-grid');
  grid.innerHTML = visible.length ? visible.map(c => `
      <div class="cover-flow-cell" onclick="openGroupFromAllPhotos('${c.albumId}','${c.rowId}')">
        <img src="${c.photo.thumb || c.photo.src}" alt="${esc(c.photo.caption||'')}" loading="lazy" decoding="async">
        ${c.rowLabel ? `<div class="cover-flow-label">${esc(c.rowLabel)}</div>` : ''}
      </div>`).join('')
    : '<p style="color:#ccc;font-size:14px;">No photos match these filters.</p>';
}

// ── Single album ──────────────────────────────────────────────────
function openAlbum(id) {
  const album = albums.find(a => a.id === id);
  if (!album) return;
  currentAlbumId = id;
  exitSelectMode();
  renderSidebar(id);

  document.getElementById('album-list').style.display = 'none';
  document.getElementById('album-view').style.display  = 'block';
  document.getElementById('album-view-title').textContent = album.name;
  if (isAdmin) document.getElementById('album-view-edit-btn').style.display = 'inline';

  renderPhotoRows(album);
}

// ── Group photos into rows ────────────────────────────────────────
function groupPhotosIntoRows(photos) {
  const rowMap = new Map();
  const rowOrder = [];
  let autoBuffer = [];

  function flushAuto() {
    for (let i = 0; i < autoBuffer.length; i += ROW_CHUNK) {
      const chunk = autoBuffer.slice(i, i + ROW_CHUNK);
      const rid = '__auto_' + chunk[0].id;
      rowMap.set(rid, chunk);
      rowOrder.push(rid);
    }
    autoBuffer = [];
  }

  photos.forEach(p => {
    if (p.rowId) {
      flushAuto();
      if (!rowMap.has(p.rowId)) { rowMap.set(p.rowId, []); rowOrder.push(p.rowId); }
      rowMap.get(p.rowId).push(p);
    } else {
      autoBuffer.push(p);
    }
  });
  flushAuto();

  return rowOrder.map(rid => ({ rowId: rid, photos: rowMap.get(rid) }));
}

// ── Render individual album — catalog layout ──────────────────────
function renderPhotoRows(album) {
  const photos = album.photos || [];
  const rows = groupPhotosIntoRows(photos);
  lightboxPhotos = photos.slice();

  const container = document.getElementById('photo-rows');
  if (!photos.length) {
    container.innerHTML = '<p style="color:#ccc;font-size:14px;margin-top:20px;">' +
      'No photos yet' + (isAdmin ? ' — click <strong>+ New</strong> to add.' : '.') + '</p>';
    return;
  }

  function photoCell(p, isCover, pIdx, color) {
    // The cover always crops to a square (object-fit:cover). Group photos
    // scale to the row height with no cropping — if a photo needs to look
    // square there too, that's baked into the file itself via the crop
    // editor, so it's naturally square already and needs no special CSS.
    const cls = isCover ? 'catalog-cover' : 'catalog-thumb';
    return `<div class="${cls} photo-cell-wrap" data-photo-id="${p.id}" data-photo-idx="${pIdx}" style="border-color:${color}"
                 onclick="rowImgClick(event,'${p.id}',${pIdx})">
      <img src="${p.thumb || p.src}" alt="${esc(p.caption||'')}" loading="lazy" decoding="async" onload="markOverflowingRows();fitRowHighlights()">
      <div class="select-check">✓</div>
      ${isAdmin ? `<div class="photo-admin-btns">
        <button class="photo-edit-btn" onclick="event.stopPropagation();openPhotoModal('${p.id}')">✎</button>
        <button class="photo-del-btn"  onclick="event.stopPropagation();deletePhoto('${p.id}')">✕</button>
      </div>` : ''}
    </div>`;
  }

  container.innerHTML = `<div class="catalog-layout">` +
    rows.map((row, rowIdx) => {
      const cover    = row.photos[0];
      const rest     = row.photos.slice(1);
      const coverIdx = photos.findIndex(x => x.id === cover.id);
      const color    = cover.rowColor || BORDER_COLORS[rowIdx % BORDER_COLORS.length];
      const label    = cover.rowLabel || '';
      const thumbs   = rest.map(p => photoCell(p, false, photos.findIndex(x => x.id === p.id), color)).join('');
      return `<div class="catalog-row" data-row-idx="${rowIdx}" data-row-id="${row.rowId}" onclick="rowClick(event,${rowIdx})">
        <div class="catalog-row-bg"></div>
        ${photoCell(cover, true, coverIdx, color)}
        <div class="catalog-label">${label ? `<span class="catalog-label-text">::${esc(label)}::</span>` : ''}</div>
        <div class="catalog-thumbs">${thumbs}</div>
        ${isAdmin ? `
          <input type="color" class="row-color-input" value="${color}" title="Group colour"
                 onclick="event.stopPropagation()" onchange="event.stopPropagation();setRowColor('${row.rowId}', this.value)">
          <button class="row-edit-icon" onclick="event.stopPropagation();renameRowGroup('${row.rowId}')" title="Rename group">✎</button>
        ` : ''}
      </div>`;
    }).join('') +
    `</div>`;

  container._rows = rows;
  if (isAdmin) { addPhotoDragHandlers(); addRowDragHandlers(); }
  markOverflowingRows();
  scaleOverflowingLabels();
  fitRowHighlights();
}

// Only fade+scroll a row's thumbs strip when it actually overflows its container.
function markOverflowingRows() {
  document.querySelectorAll('.catalog-thumbs').forEach(el => {
    el.classList.toggle('overflowing', el.scrollWidth > el.clientWidth + 1);
  });
}
// Group names never wrap — if one is too long for its column, shrink it
// horizontally to fit instead of wrapping or clipping.
function scaleOverflowingLabels() {
  document.querySelectorAll('.catalog-label-text').forEach(el => {
    el.style.transform = '';
    const available = el.parentElement.clientWidth;
    if (el.scrollWidth > available && available > 0) {
      el.style.transform = `scaleX(${available / el.scrollWidth})`;
    }
  });
}
// Size each row's hover highlight to end at the last visible photo instead
// of the full flex-stretched row width.
function fitRowHighlights() {
  document.querySelectorAll('.catalog-row').forEach(row => {
    const cover  = row.querySelector('.catalog-cover');
    const label  = row.querySelector('.catalog-label');
    const thumbs = row.querySelector('.catalog-thumbs');
    const bg     = row.querySelector('.catalog-row-bg');
    if (!cover || !label || !thumbs || !bg) return;
    const gap = parseFloat(getComputedStyle(row).gap) || 0;
    // thumbs.scrollWidth is never less than its clientWidth (that's how the
    // DOM defines it) — it can't tell us the *actual* content width when the
    // flex:1 track is wider than the photos it holds. Sum the children instead.
    const thumbGap = parseFloat(getComputedStyle(thumbs).gap) || 0;
    const kids = Array.from(thumbs.children);
    const naturalW = kids.reduce((sum, el) => sum + el.offsetWidth, 0) + Math.max(0, kids.length - 1) * thumbGap;
    const thumbsContentW = Math.min(naturalW, thumbs.clientWidth);
    // bg starts 7px left of the cover and extends 7px past the last thumb —
    // matching .catalog-row's own padding on every side.
    bg.style.width = (7 + cover.offsetWidth + gap + label.offsetWidth + gap + thumbsContentW + 7) + 'px';
  });
}
let _overflowResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_overflowResizeTimer);
  _overflowResizeTimer = setTimeout(() => { markOverflowingRows(); scaleOverflowingLabels(); fitRowHighlights(); }, 150);
});

// ── Row / image click logic ───────────────────────────────────────
function rowImgClick(e, photoId, photoIdx) {
  // Only intercept if clicking the checkbox itself
  if (e.target.classList.contains('select-check')) {
    e.stopPropagation();
    toggleSelect(photoId, e.currentTarget);
  }
  // Otherwise bubble up to rowClick (opens modal)
}

function rowClick(e, rowIdx) {
  if (selectMode) return;
  const container = document.getElementById('photo-rows');
  const rows = container._rows;
  if (!rows || !rows[rowIdx]) return;
  returnToAllPhotos = false;
  document.getElementById('row-modal-close').textContent = '✕';
  openRowModal(rows[rowIdx].rowId);
}

// Entry point from the "All Photos" cover index — the row-modal doubles as
// the "group view", closing it returns to the covers index it was opened from.
let returnToAllPhotos = false;
function openGroupFromAllPhotos(albumId, rowId) {
  currentAlbumId = albumId;
  returnToAllPhotos = true;
  document.getElementById('row-modal-close').textContent = '← Back';
  openRowModal(rowId);
}

// ── Row modal (group grid view) ────────────────────────────────────
let currentRowId = null;
let detailDragId = null;

function openRowModal(rowId) {
  const album = albums.find(a => a.id === currentAlbumId);
  const rows = groupPhotosIntoRows(album ? (album.photos || []) : []);
  const row = rows.find(r => r.rowId === rowId);
  if (!row) { closeRowModal(); return; }

  currentRowId = rowId;
  const isRealGroup = !rowId.startsWith('__auto_');
  const label = row.photos[0] && row.photos[0].rowLabel;

  const tile = (p) => `
    <div class="detail-tile" data-photo-id="${p.id}"
         ${isAdmin ? `draggable="true" ondragstart="detailDragId='${p.id}'"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="event.preventDefault();this.classList.remove('drag-over');dropOnDetailTile('${p.id}')"` : ''}
         onclick="event.stopPropagation();openPhotoDetail('${p.id}')">
      <img src="${p.thumb || p.src}" alt="${esc(p.caption||'')}" loading="lazy" decoding="async">
      ${p.caption ? `<div class="detail-tile-overlay">${esc(p.caption)}</div>` : ''}
      ${isAdmin ? `<button class="detail-tile-del" onclick="event.stopPropagation();deletePhotoFromGrid('${p.id}')">✕</button>` : ''}
    </div>`;

  const addTile = (isAdmin && isRealGroup)
    ? `<button class="detail-add-tile" data-row-id="${esc(rowId)}" data-row-label="${esc(label || '')}"
         onclick="event.stopPropagation();addToRow(this.dataset.rowId, this.dataset.rowLabel)">+</button>`
    : '';

  const inner = document.getElementById('row-modal-inner');
  inner.innerHTML = (label ? `<div class="row-modal-header">${esc(label)}</div>` : '') +
    `<div class="detail-grid">${row.photos.map(tile).join('')}${addTile}</div>`;

  document.getElementById('row-modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function refreshRowModal() {
  if (document.getElementById('row-modal').classList.contains('active') && currentRowId) {
    openRowModal(currentRowId);
  }
}
function closeRowModal() {
  document.getElementById('row-modal').classList.remove('active');
  document.body.style.overflow = '';
  currentRowId = null;
  if (returnToAllPhotos) {
    returnToAllPhotos = false;
    currentAlbumId = null;
    renderAlbumList();
  }
}
document.getElementById('row-modal-close').onclick = closeRowModal;
document.getElementById('row-modal').addEventListener('click', e => {
  if (e.target.id === 'row-modal') closeRowModal();
});

async function deletePhotoFromGrid(id) {
  if (!confirm('Remove this photo?')) return;
  const album = albums.find(a => a.id === currentAlbumId);
  album.photos = album.photos.filter(p => p.id !== id);
  await persist();
  renderPhotoRows(album);
  refreshRowModal();
}

async function dropOnDetailTile(targetId) {
  if (!detailDragId || detailDragId === targetId || !currentRowId) { detailDragId = null; return; }
  const album = albums.find(a => a.id === currentAlbumId);
  const rows = groupPhotosIntoRows(album.photos || []);
  const row = rows.find(r => r.rowId === currentRowId);
  if (!row) { detailDragId = null; return; }

  const ids = row.photos.map(p => p.id);
  const fromIdx = ids.indexOf(detailDragId), toIdx = ids.indexOf(targetId);
  detailDragId = null;
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = ids.splice(fromIdx, 1);
  ids.splice(toIdx, 0, moved);

  // Write the row's new order back into the same index positions its photos
  // already occupied in album.photos, leaving every other photo untouched.
  const positions = [];
  album.photos.forEach((p, i) => { if (row.photos.some(rp => rp.id === p.id)) positions.push(i); });
  const reordered = ids.map(id => row.photos.find(p => p.id === id));
  positions.forEach((pos, i) => { album.photos[pos] = reordered[i]; });

  await persist();
  renderPhotoRows(album);
  refreshRowModal();
}

function addToRow(rowId, rowLabel) {
  // Not a real "close" — we're immediately opening the add-photo modal for
  // the same album, so skip closeRowModal()'s return-to-All-Photos handling
  // (which would null out currentAlbumId before openPhotoModal needs it).
  document.getElementById('row-modal').classList.remove('active');
  document.body.style.overflow = '';
  currentRowId = null;
  openPhotoModal(null, { rowId, rowLabel });
}

function renameRowGroup(rowId) {
  if (rowId.startsWith('__auto_')) {
    alert('This is an automatic row — give its photos a Group name (via Edit Photo) to make it renameable.');
    return;
  }
  const album = albums.find(a => a.id === currentAlbumId);
  const current = ((album.photos || []).find(p => p.rowId === rowId) || {}).rowLabel || '';
  const next = prompt('Rename this group:', current);
  if (next === null) return;
  album.photos.forEach(p => { if (p.rowId === rowId) p.rowLabel = next; });
  persist().then(() => renderPhotoRows(album));
}

function setRowColor(rowId, color) {
  if (rowId.startsWith('__auto_')) {
    alert('This is an automatic row — give its photos a Group name (via Edit Photo) to make its colour customizable.');
    return;
  }
  const album = albums.find(a => a.id === currentAlbumId);
  album.photos.forEach(p => { if (p.rowId === rowId) p.rowColor = color; });
  persist().then(() => renderPhotoRows(album));
}

// ── Rearranging whole groups (rows) ─────────────────────────────────
let dragRowId = null;
function addRowDragHandlers() {
  const rowEls = document.querySelectorAll('#photo-rows .catalog-row');
  rowEls.forEach(el => {
    el.draggable = true;
    el.addEventListener('dragstart', function(e) {
      dragRowId = this.dataset.rowId;
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      rowEls.forEach(r => r.classList.remove('drag-over'));
      this.classList.add('drag-over');
    });
    el.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
    el.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      const targetRowId = this.dataset.rowId;
      if (!dragRowId || dragRowId === targetRowId) { dragRowId = null; return; }
      reorderGroupRows(dragRowId, targetRowId);
      dragRowId = null;
    });
    el.addEventListener('dragend', function() {
      rowEls.forEach(r => r.classList.remove('drag-over'));
    });
  });
}
function reorderGroupRows(fromRowId, toRowId) {
  const album = albums.find(a => a.id === currentAlbumId);
  const rows = groupPhotosIntoRows(album.photos || []);
  const order = rows.map(r => r.rowId);
  const fromIdx = order.indexOf(fromRowId), toIdx = order.indexOf(toRowId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = order.splice(fromIdx, 1);
  order.splice(toIdx, 0, moved);

  // Rebuild album.photos by concatenating each row's own photo objects, in the
  // new row order — every photo keeps its original rowId/rowLabel untouched,
  // so a group's name can never drift out of sync with its photos here.
  const rowMap = new Map(rows.map(r => [r.rowId, r.photos]));
  album.photos = order.flatMap(rid => rowMap.get(rid));

  persist().then(() => renderPhotoRows(album));
}

// ── Photo detail popup ───────────────────────────────────────────
let currentDetailPhotoId = null;
let detailList = [];

// Step to the previous (-1) / next (+1) photo, wrapping around at the ends
function stepPhotoDetail(dir) {
  if (detailList.length < 2) return;
  const i = detailList.indexOf(currentDetailPhotoId);
  openPhotoDetail(detailList[(i + dir + detailList.length) % detailList.length]);
}

function openPhotoDetail(id) {
  const album = albums.find(a => a.id === currentAlbumId) || albums.find(a => (a.photos||[]).some(p => p.id === id));
  const photo = album && (album.photos || []).find(p => p.id === id);
  if (!photo) return;

  currentDetailPhotoId = id;
  const img = document.getElementById('photo-detail-img');
  // Larger version when there is one — the thumb is far too small at this size
  img.src = photo.display || photo.src || photo.thumb;
  img.alt = photo.caption || '';

  // The photos the arrows step through: the group this was opened from, or
  // the whole album if it wasn't opened from an expanded group.
  const groupRow = currentRowId && groupPhotosIntoRows(album.photos || []).find(r => r.rowId === currentRowId);
  detailList = (groupRow && groupRow.photos.some(p => p.id === id) ? groupRow.photos : (album.photos || [])).map(p => p.id);
  const pos = detailList.indexOf(id);
  const multi = detailList.length > 1;
  document.getElementById('photo-detail-prev').hidden = !multi;
  document.getElementById('photo-detail-next').hidden = !multi;
  document.getElementById('photo-detail-counter').textContent = multi ? (pos + 1) + ' / ' + detailList.length : '';

  const year = photoYear(photo);
  const tags = (photo.tags || '').split(',').map(t => t.trim()).filter(Boolean);
  const rows = [
    photo.caption && ['Caption', esc(photo.caption)],
    photo.date    && ['Date', esc(photo.date)],
    year          && ['Year', esc(year)],
    photo.city    && ['City', esc(photo.city)],
    tags.length   && ['Tags', tags.map(t => `<span class="photo-detail-tag">${esc(t)}</span>`).join('')],
    photo.notes   && ['Notes', esc(photo.notes)],
  ].filter(Boolean);

  document.getElementById('photo-detail-meta').innerHTML = rows.length
    ? rows.map(([k, v]) => `<div class="photo-detail-row"><span class="photo-detail-key">${k}</span><span class="photo-detail-val">${v}</span></div>`).join('')
    : '<p style="color:#ccc;font-size:13px;">No details yet.</p>';

  document.getElementById('photo-detail-actions').innerHTML = isAdmin ? `
    <button class="modal-save-btn" onclick="closePhotoDetail();openPhotoModal('${photo.id}')">Edit details</button>
    <button class="modal-cancel-btn" onclick="document.getElementById('photo-detail-replace-input').click()">Replace image</button>
    <button class="modal-cancel-btn" style="color:#c00;" onclick="deletePhotoFromDetail('${photo.id}')">Delete photo</button>
  ` : '';

  document.getElementById('photo-detail-modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closePhotoDetail() {
  document.getElementById('photo-detail-modal').classList.remove('active');
  document.body.style.overflow = '';
  currentDetailPhotoId = null;
}
async function deletePhotoFromDetail(id) {
  if (!confirm('Remove this photo?')) return;
  const album = albums.find(a => a.id === currentAlbumId);
  album.photos = album.photos.filter(p => p.id !== id);
  await persist();
  renderPhotoRows(album);
  closePhotoDetail();
  refreshRowModal();
}
document.getElementById('photo-detail-close').onclick = closePhotoDetail;
document.getElementById('photo-detail-modal').addEventListener('click', e => {
  if (e.target.id === 'photo-detail-modal') closePhotoDetail();
});
document.getElementById('photo-detail-prev').onclick = e => { e.stopPropagation(); stepPhotoDetail(-1); };
document.getElementById('photo-detail-next').onclick = e => { e.stopPropagation(); stepPhotoDetail(1); };

// Swipe left/right on the photo to step through (touch screens)
(function () {
  const stage = document.getElementById('photo-detail-stage');
  let startX = null, startY = null;
  stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
    startX = startY = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) stepPhotoDetail(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
document.getElementById('photo-detail-replace-input').addEventListener('change', async function() {
  const file = this.files[0];
  this.value = '';
  if (!file || !currentDetailPhotoId) return;
  const album = albums.find(a => a.id === currentAlbumId);
  const photo = album && album.photos.find(p => p.id === currentDetailPhotoId);
  if (!photo) return;

  const fd = new FormData(); fd.append('file', file); fd.append('type', 'albums');
  const up = await fetch(UPLOAD_URL, { method: 'POST', body: fd }).then(r => r.json()).catch(() => ({}));
  if (!up.success) { alert('Upload error: ' + (up.error || 'unknown error')); return; }

  photo.src = up.path;
  if (up.thumb) photo.thumb = up.thumb; else delete photo.thumb;
  if (up.display) photo.display = up.display; else delete photo.display;
  if (up.width && up.height) { photo.width = up.width; photo.height = up.height; }
  else { delete photo.width; delete photo.height; }

  await persist();
  renderPhotoRows(album);
  refreshRowModal();
  openPhotoDetail(photo.id);
});


// ── Multi-select ──────────────────────────────────────────────────
function exitSelectMode() {
  selectedPhotos.clear();
  document.querySelectorAll('.row-img.selected, .photo-cell-wrap.selected').forEach(el => el.classList.remove('selected'));
  updateSelectToolbar();
}
function toggleSelect(photoId, el) {
  if (selectedPhotos.has(photoId)) {
    selectedPhotos.delete(photoId);
    el.classList.remove('selected');
  } else {
    selectedPhotos.add(photoId);
    el.classList.add('selected');
    if (selectedPhotos.size === 1) populateMoveDropdown();
  }
  updateSelectToolbar();
}
function updateSelectToolbar() {
  const toolbar = document.getElementById('select-toolbar');
  const count = selectedPhotos.size;
  document.getElementById('select-count').textContent = count + ' selected';
  toolbar.classList.toggle('visible', count > 0);
}
function populateMoveDropdown() {
  const sel = document.getElementById('move-album-select');
  sel.innerHTML = '<option value="">— album —</option>' +
    albums.filter(a => a.id !== currentAlbumId).map(a =>
      `<option value="${a.id}">${esc(a.name)}</option>`
    ).join('');
}

async function bulkDelete() {
  if (!selectedPhotos.size) return;
  if (!confirm(`Delete ${selectedPhotos.size} photo(s)? This cannot be undone.`)) return;
  const album = albums.find(a => a.id === currentAlbumId);
  album.photos = album.photos.filter(p => !selectedPhotos.has(p.id));
  await persist();
  exitSelectMode();
  renderPhotoRows(album);
}

async function bulkMove() {
  const targetId = document.getElementById('move-album-select').value;
  if (!targetId || !selectedPhotos.size) return;
  const srcAlbum = albums.find(a => a.id === currentAlbumId);
  const dstAlbum = albums.find(a => a.id === targetId);
  if (!dstAlbum) return;

  const moving = srcAlbum.photos.filter(p => selectedPhotos.has(p.id));
  srcAlbum.photos = srcAlbum.photos.filter(p => !selectedPhotos.has(p.id));
  // Move to dst album, strip rowId so they get auto-grouped there
  moving.forEach(p => { delete p.rowId; dstAlbum.photos.push(p); });

  await persist();
  exitSelectMode();
  renderPhotoRows(srcAlbum);
}

// ── Drag to reorder ───────────────────────────────────────────────
function addPhotoDragHandlers() {
  const cells = document.querySelectorAll('#photo-rows .photo-cell-wrap');
  cells.forEach(el => {
    el.draggable = true;
    el.addEventListener('dragstart', function(e) {
      dragSrc = this.dataset.photoIdx;
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragover', function(e) {
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      cells.forEach(c => c.classList.remove('drag-over'));
      this.classList.add('drag-over');
    });
    el.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
    el.addEventListener('drop', function(e) {
      e.preventDefault(); e.stopPropagation();
      this.classList.remove('drag-over');
      const dropIdx = parseInt(this.dataset.photoIdx);
      const srcIdx  = parseInt(dragSrc);
      if (isNaN(srcIdx) || srcIdx === dropIdx) return;
      const album = albums.find(a => a.id === currentAlbumId);
      const moved = album.photos.splice(srcIdx, 1)[0];
      album.photos.splice(dropIdx, 0, moved);
      renderPhotoRows(album);
      persist(true);
    });
    el.addEventListener('dragend', function() {
      cells.forEach(c => c.classList.remove('drag-over'));
    });
  });
}

// ── Crop / framing editor ────────────────────────────────────────
// The stage preview uses object-position + transform:scale purely for live
// visual feedback. On save, if the user actually touched anything, the same
// framing is converted to a pixel crop rectangle and baked into a real new
// image file server-side (admin/crop-image.php) — this never just stores a
// CSS overlay, it replaces the photo's actual src.
let cropState = { x: 50, y: 50, zoom: 1, ratioW: 1, ratioH: 1, touched: false };

function applyCropStagePreview() {
  const img = document.getElementById('crop-stage-img');
  img.style.objectPosition = cropState.x + '% ' + cropState.y + '%';
  img.style.transform = 'scale(' + cropState.zoom + ')';
  img.style.transformOrigin = cropState.x + '% ' + cropState.y + '%';
  document.getElementById('crop-stage').style.aspectRatio = cropState.ratioW + ' / ' + cropState.ratioH;
}
function setCropRatio(w, h) {
  cropState.ratioW = w; cropState.ratioH = h; cropState.touched = true;
  document.getElementById('crop-ratio-w').value = w;
  document.getElementById('crop-ratio-h').value = h;
  applyCropStagePreview();
}
function onCropRatioInput() {
  const w = Math.max(1, parseFloat(document.getElementById('crop-ratio-w').value) || 1);
  const h = Math.max(1, parseFloat(document.getElementById('crop-ratio-h').value) || 1);
  setCropRatio(w, h);
}
// Converts the current drag/zoom/ratio framing into a crop rectangle
// expressed as percentages of the source image's own width/height.
function currentCropRectPct() {
  const img = document.getElementById('crop-stage-img');
  const imgAspect = img.naturalWidth / img.naturalHeight;
  const targetAspect = cropState.ratioW / cropState.ratioH;
  let baseW, baseH;
  if (imgAspect > targetAspect) { baseH = 100; baseW = 100 * (targetAspect / imgAspect); }
  else                          { baseW = 100; baseH = 100 * (imgAspect / targetAspect); }
  const w = baseW / cropState.zoom, h = baseH / cropState.zoom;
  const x = Math.min(100 - w, Math.max(0, cropState.x - w / 2));
  const y = Math.min(100 - h, Math.max(0, cropState.y - h / 2));
  return { x, y, w, h };
}
function initCropEditor(srcUrl) {
  cropState = { x: 50, y: 50, zoom: 1, ratioW: 1, ratioH: 1, touched: false };
  document.getElementById('crop-stage-img').src = srcUrl;
  document.getElementById('crop-zoom-slider').value = 1;
  document.getElementById('crop-ratio-w').value = 1;
  document.getElementById('crop-ratio-h').value = 1;
  document.getElementById('photo-crop-editor').style.display = 'block';
  applyCropStagePreview();
}
function hideCropEditor() {
  document.getElementById('photo-crop-editor').style.display = 'none';
  cropState = { x: 50, y: 50, zoom: 1, ratioW: 1, ratioH: 1, touched: false };
}
// Sends the current crop to the server and applies the result (new src/
// thumb/display/width/height) onto photoObj. Returns true on success.
async function bakeCropInto(photoObj) {
  const rect = currentCropRectPct();
  const res = await fetch('admin/crop-image.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ src: photoObj.src, x: rect.x, y: rect.y, w: rect.w, h: rect.h })
  }).then(r => r.json()).catch(() => ({}));
  if (!res.success) { alert('Crop error: ' + (res.error || 'unknown error')); return false; }
  photoObj.src = res.src;
  if (res.thumb) photoObj.thumb = res.thumb; else delete photoObj.thumb;
  if (res.display) photoObj.display = res.display; else delete photoObj.display;
  if (res.width && res.height) { photoObj.width = res.width; photoObj.height = res.height; }
  return true;
}
// Bakes a 90° rotation into the photo's actual file, right away (not
// deferred to the modal's Save button) — the crop editor's drag/zoom math
// reads the image's live natural dimensions, so the stage needs to already
// be showing the rotated file before any further framing is done on it.
// Persists immediately too: the old file is deleted server-side as part of
// this, so albums.json must be flushed in the same step or a Cancel here
// would leave the JSON pointing at a file that no longer exists.
async function rotatePhoto(degrees) {
  if (!editingPhotoId) return;
  const album = albums.find(a => a.id === currentAlbumId);
  const photo = album && album.photos.find(p => p.id === editingPhotoId);
  if (!photo) return;
  const btns = document.querySelectorAll('.crop-rotate-btn');
  btns.forEach(b => b.disabled = true);
  const res = await fetch('admin/rotate-image.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ src: photo.src, degrees })
  }).then(r => r.json()).catch(() => ({}));
  btns.forEach(b => b.disabled = false);
  if (!res.success) { alert('Rotate error: ' + (res.error || 'unknown error')); return; }
  photo.src = res.src;
  if (res.thumb) photo.thumb = res.thumb; else delete photo.thumb;
  if (res.display) photo.display = res.display; else delete photo.display;
  if (res.width && res.height) { photo.width = res.width; photo.height = res.height; }
  await persist(true);
  initCropEditor(photo.src);
}
(function setupCropDrag() {
  const stage = document.getElementById('crop-stage');
  let dragging = false, lastX = 0, lastY = 0;
  stage.addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const rect = stage.getBoundingClientRect();
    const dxPct = (e.clientX - lastX) / rect.width * 100;
    const dyPct = (e.clientY - lastY) / rect.height * 100;
    lastX = e.clientX; lastY = e.clientY;
    cropState.x = Math.min(100, Math.max(0, cropState.x - dxPct));
    cropState.y = Math.min(100, Math.max(0, cropState.y - dyPct));
    cropState.touched = true;
    applyCropStagePreview();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt =>
    stage.addEventListener(evt, () => { dragging = false; stage.classList.remove('dragging'); })
  );
  document.getElementById('crop-zoom-slider').addEventListener('input', function() {
    cropState.zoom = parseFloat(this.value);
    cropState.touched = true;
    applyCropStagePreview();
  });
})();

function getExistingRowGroups() {
  const album = albums.find(a => a.id === currentAlbumId);
  if (!album) return [];
  const seen = new Map();
  (album.photos||[]).forEach(p => {
    if (p.rowId && !seen.has(p.rowId)) seen.set(p.rowId, p.rowLabel || p.rowId.slice(0,8));
  });
  return [...seen.entries()].map(([rowId, label]) => ({ rowId, label }));
}

let presetRow = null;

  // makes sense for a photo that already has one there — a freshly picked
  // local file has no server path yet.

  document.getElementById('photo-modal').classList.remove('active');
  presetRow = null;
  document.getElementById('photo-group-input').disabled = false;
}

document.getElementById('photo-modal-save').onclick = async () => {
  const album = albums.find(a=>a.id===currentAlbumId);
  if (!album) return;

  const files      = document.getElementById('photo-file-input').files;
  const coverFile  = document.getElementById('photo-cover-input').files[0] || null;
  const caption    = document.getElementById('photo-caption-input').value.trim();
  const date       = document.getElementById('photo-date-input').value.trim();
  const city       = document.getElementById('photo-city-input').value.trim();
  const tags       = document.getElementById('photo-tags-input').value.trim();
  const notes      = document.getElementById('photo-notes-input').value.trim();
  const groupInput = document.getElementById('photo-group-input').value.trim();

  if (!editingPhotoId && !files.length && !coverFile) { alert('Please select at least one image.'); return; }

  const btn = document.getElementById('photo-modal-save');
  btn.textContent = 'Saving…'; btn.classList.add('modal-saving');

  if (editingPhotoId) {
    const photo = album.photos.find(p=>p.id===editingPhotoId);
    photo.caption = caption;
    photo.date    = date;
    if (city)  photo.city  = city;  else delete photo.city;
    if (tags)  photo.tags  = tags;  else delete photo.tags;
    if (notes) photo.notes = notes; else delete photo.notes;
    // Legacy CSS-only crop fields from an earlier version — framing is now
    // baked into the actual image file instead, so these no longer apply.
    delete photo.cropX; delete photo.cropY; delete photo.cropZoom; delete photo.cropMode;

    const rowVal = document.getElementById('photo-row-select').value;
    if (rowVal === '__new__') {
      photo.rowId = uid();
      photo.rowLabel = groupInput || '';
    } else if (rowVal) {
      photo.rowId = rowVal;
      if (groupInput) photo.rowLabel = groupInput;
    } else {
      delete photo.rowId;
      delete photo.rowLabel;
    }

    if (files[0]) {
      const fd = new FormData(); fd.append('file', files[0]); fd.append('type', 'albums');
      const up = await fetch(UPLOAD_URL, {method:'POST',body:fd}).then(r=>r.json()).catch(()=>({}));
      if (up.success) {
        photo.src = up.path;
        if (up.thumb) photo.thumb = up.thumb; else delete photo.thumb;
        if (up.display) photo.display = up.display; else delete photo.display;
        if (up.width && up.height) { photo.width = up.width; photo.height = up.height; }
        else { delete photo.width; delete photo.height; }
      }
      else if (up.error) { alert('Upload error: ' + up.error); btn.textContent='Save'; btn.classList.remove('modal-saving'); return; }
    }

    if (cropState.touched) {
      const ok = await bakeCropInto(photo);
      if (!ok) { btn.textContent = 'Save'; btn.classList.remove('modal-saving'); return; }
    }
  } else {
    // All files in this batch share the same rowId; group name labels the row.
    // If we came from "+ Add" inside an existing group's grid, join that exact
    // row instead of minting a new one.
    const batchRowId = presetRow ? presetRow.rowId
      : groupInput ? groupInput.toLowerCase().replace(/\s+/g, '-') + '-' + uid().slice(0,4)
      : uid();
    const batchLabel = presetRow ? (presetRow.rowLabel || '') : (groupInput || '');

    async function uploadOne(file) {
      const fd = new FormData(); fd.append('file', file); fd.append('type', 'albums');
      const up = await fetch(UPLOAD_URL, {method:'POST',body:fd}).then(r=>r.json()).catch(()=>({}));
      if (!up.success) { alert('Upload error: ' + (up.error||'unknown error')); return null; }
      return {
        id: uid(), src: up.path, thumb: up.thumb || undefined, display: up.display || undefined,
        width: up.width || undefined, height: up.height || undefined,
        caption, date, city: city || undefined, tags: tags || undefined, notes: notes || undefined,
        added: todayISO(), rowId: batchRowId, rowLabel: batchLabel
      };
    }

    // The explicit cover, if provided, is pushed first so it lands as
    // photos[0] for this row — that's what every view treats as "the cover."
    if (coverFile) {
      const coverPhoto = await uploadOne(coverFile);
      if (coverPhoto) album.photos.push(coverPhoto);
    }
    // The crop editor operates on this input regardless of whether a
    // separate cover was also picked, and only appears for a single
    // selected file — a batch of several stays uncropped.
    for (const file of files) {
      const newPhoto = await uploadOne(file);
      if (!newPhoto) continue;
      if (files.length === 1 && cropState.touched) await bakeCropInto(newPhoto);
      album.photos.push(newPhoto);
    }
  }

  await persist();
  btn.textContent = 'Save'; btn.classList.remove('modal-saving');
  closePhotoModal();
  renderPhotoRows(album);
};

async function deletePhoto(id) {
  if (!confirm('Remove this photo?')) return;
  const album = albums.find(a=>a.id===currentAlbumId);
  album.photos = album.photos.filter(p=>p.id!==id);
  await persist();
  renderPhotoRows(album);
}

// ── Persist ───────────────────────────────────────────────────────
async function persist(silent = false) {
  try {
    const res = await fetch(SAVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(albums)
    }).then(r=>r.json());
    if (!res.success && !silent) alert('Save error: ' + (res.error||'unknown'));
  } catch(e) {
    if (!silent) alert('Network error — changes not saved.');
  }
}

// ── Helpers ───────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
function todayISO() { return new Date().toISOString().slice(0, 10); }

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function previewFile(input, previewId) {
  const prev = document.getElementById(previewId);
  const file = input.files[0];
  if (!file) { prev.style.display='none'; return; }
  const reader = new FileReader();
  reader.onload = e => { prev.src = e.target.result; prev.style.display = 'block'; };
  reader.readAsDataURL(file);
}

init();
</script>
